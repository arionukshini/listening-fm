name: Update Albums

on:
  workflow_dispatch:
    inputs:
      list:
        description: 'Which panel?'
        required: true
        type: choice
        options:
          - recent
          - top5
        default: recent
      title:
        description: 'Album title'
        required: true
        type: string
      artist:
        description: 'Artist'
        required: true
        type: string
      score:
        description: 'Score, 0-100'
        required: true
        type: string
      url:
        description: '(optional) link to the review — leave blank to link your AOTY profile instead'
        required: false
        type: string
      art:
        description: '(optional) cover art URL override — leave blank to auto-resolve via Last.fm'
        required: false
        type: string
      year:
        description: '(optional) only needed to change the "Top Albums of ____" year label'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update aoty.json
        run: node scripts/update-aoty.mjs
        env:
          LIST: ${{ inputs.list }}
          TITLE: ${{ inputs.title }}
          ARTIST: ${{ inputs.artist }}
          SCORE: ${{ inputs.score }}
          URL: ${{ inputs.url }}
          ART: ${{ inputs.art }}
          YEAR: ${{ inputs.year }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/aoty.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update ${{ inputs.list }} — ${{ inputs.title }} by ${{ inputs.artist }}"
          git push origin HEAD:main
