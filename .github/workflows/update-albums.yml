name: Update Albums

on:
  workflow_dispatch:
    inputs:
      list:
        description: 'Which panel?'
        required: false
        type: choice
        options:
          - recent
          - top5
        default: recent
      title:
        description: 'Album title'
        required: false
        type: string
      artist:
        description: 'Artist'
        required: false
        type: string
      score:
        description: 'Score, 0-100'
        required: false
        type: string
      url:
        description: '(optional) direct AOTY album/review link — blank uses your AOTY profile'
        required: false
        type: string
      art:
        description: '(optional) cover art URL override — leave blank to auto-resolve via Last.fm'
        required: false
        type: string
      year:
        description: '(optional) only needed to change the "Top Albums of ____" year label'
        required: false
        type: string
      albums:
        description: 'Optional bulk mode: one per line as list | title | artist | score | url | art'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update aoty.json
        run: node scripts/update-aoty.mjs
        env:
          LIST: ${{ inputs.list }}
          TITLE: ${{ inputs.title }}
          ARTIST: ${{ inputs.artist }}
          SCORE: ${{ inputs.score }}
          URL: ${{ inputs.url }}
          ART: ${{ inputs.art }}
          YEAR: ${{ inputs.year }}
          ALBUMS: ${{ inputs.albums }}

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/aoty.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update AOTY albums"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The push above won't trigger deploy.yml on its own — GitHub doesn't let
  # a push made with the default GITHUB_TOKEN trigger other workflows, to
  # prevent infinite loops. So this calls the same build/deploy directly
  # instead of hoping the push event fires it.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
    secrets: inherit
